name: Node.js CI/CD on Amazon EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/nodejsapp
            git fetch origin main
            git reset --hard origin/main
            npm install --production
            pm2 restart nodejsapp || pm2 start server.js --name "nodejsapp"